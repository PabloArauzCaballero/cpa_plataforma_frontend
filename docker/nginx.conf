server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión de assets de texto.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Los bundles de Vite llevan hash en el nombre: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de react-router cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea para que el deploy nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
