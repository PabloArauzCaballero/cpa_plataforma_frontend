<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CPA Plataforma Administrativa" />
    <title>CPA Plataforma</title>
    <!-- El mismo logo que usa el encabezado: la pestaña se reconoce de un vistazo
         entre varias abiertas, en vez del icono por defecto del navegador. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#00255f" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <!-- Tema aplicado antes de que React monte nada. Si esto viviera en el
         bundle, la página se pintaría primero en claro y saltaría a oscuro al
         hidratar: un destello blanco en cada carga. Mantener en sintonía con
         src/shared/theme/theme.ts (misma clave y mismo atributo). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cpa.theme.v1');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
