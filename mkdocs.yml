# Portal técnico del frontend de CPA Plataforma.
#
# IMPORTANTE — este archivo es DOCUMENTAL y OPCIONAL:
#   * MkDocs NO está instalado en este proyecto y NO se añadió como dependencia.
#   * No participa en `yarn build` ni en el despliegue del producto.
#   * La documentación se lee igual directamente en el repositorio (GitHub renderiza
#     Markdown y Mermaid), así que el portal es una comodidad, no un requisito.
#
# Para construirlo, sin tocar package.json ni yarn.lock:
#   pipx install mkdocs-material   # o: pip install mkdocs-material
#   mkdocs serve                   # http://127.0.0.1:8000
#   mkdocs build --strict          # falla ante enlaces rotos
#
# `--strict` complementa a scripts/check-doc-links.mjs, que no requiere Python.

site_name: CPA Plataforma · Frontend
site_description: Documentación técnica del frontend administrativo de CPA
docs_dir: docs
site_dir: .mkdocs-site      # fuera de dist/, que está versionado y lo sirve Cloudflare

theme:
  name: material
  language: es
  palette:
    scheme: slate           # coherente con el tema oscuro del producto
    primary: indigo
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: es

# strict: true hace fallar el build ante cualquier enlace interno roto.
strict: true

